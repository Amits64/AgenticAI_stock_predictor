<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Agentic AI Crypto Coins Price Predictor</title>

  <!-- Bootstrap CSS & Font Awesome -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" />

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>

  <!-- Three.js and OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://threejs.org/examples/js/controls/OrbitControls.js"></script>

  <style>
    /* Let html and body fill entire viewport */
    html,
    body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    body {
      background: url("/static/bg.png") no-repeat center center fixed;
      background-size: cover;
      font-family: "Poppins", sans-serif;
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }
    /* Navbar */
    .navbar {
      background-color: rgba(0, 0, 0, 0.8) !important;
      padding: 1rem 2rem;
      border-radius: 0 0 10px 10px;
    }
    .navbar-brand {
      font-size: 30px;
      font-weight: 600;
      color: #fff !important;
      margin-right: 2rem;
    }
    .navbar-text {
      color: #fff;
      font-size: 1.5rem;
      font-weight: 700;
    }
    /* Title Section */
    .title-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }
    .title-section h1 {
      font-size: 3rem;
      font-weight: 700;
      margin-bottom: 1rem;
    }
    /* Container for 3D $ */
    #threejs-container {
      width: 500px;  /* Adjust as needed */
      height: 300px; /* Adjust as needed */
      margin: auto;
    }
    /* Footer */
    .footer {
      background-color: #282c34;
      color: white;
      padding: 20px;
      text-align: center;
      border-radius: 0;
    }
    /* Circular Button Section */
    .circular-btns {
      display: flex;
      flex-direction: column;
      position: fixed;
      left: 20px;
      top: 120px;
      z-index: 1000;
    }
    .circular-btn-container {
      display: flex;
      align-items: center;
      margin: 10px 0;
    }
    .circular-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background-color: #00bcd4;
      color: #fff;
      font-size: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.3s, background-color 0.3s;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      cursor: pointer;
    }
    .circular-btn:hover {
      transform: scale(1.1);
      background-color: #0097a7;
    }
    .btn-label {
      margin-left: 8px;
      font-size: 14px;
      font-weight: 600;
    }
    /* Global Loader Overlay */
    #loader-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      z-index: 9999 !important;
      display: none;
      justify-content: center;
      align-items: center;
    }
    /* Global Loader Spinner */
    #global-loader {
      width: 100px;
      height: 100px;
      position: relative;
    }
    #global-loader .double-bounce1, #global-loader .double-bounce2 {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background-color: rgba(255, 255, 255, 0.8);
      opacity: 0.6;
      position: absolute;
      animation: bounce 2.0s infinite ease-in-out;
    }
    #global-loader .double-bounce2 {
      animation-delay: -1.0s;
    }
    @keyframes bounce {
      0%, 100% { transform: scale(0.0); }
      50% { transform: scale(1.0); }
    }
    /* Modals */
    .modal-dialog {
      max-width: 800px;
    }
    .modal-body {
      max-height: 600px;
      overflow-y: auto;
    }
    .plot-img {
      max-width: 100%;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <!-- Global Loader Overlay -->
  <div id="loader-overlay">
    <div id="global-loader">
      <div class="double-bounce1"></div>
      <div class="double-bounce2"></div>
    </div>
  </div>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark">
    <a class="navbar-brand" href="#">Agentic AI</a>
    <div class="mx-auto">
      <span class="navbar-text">Crypto Coins Price Predictor</span>
    </div>
  </nav>

  <!-- Title Section -->
  <div class="title-section">
    <h1>Welcome to Agentic AI</h1>
    <!-- Three.js container for 3D $ -->
    <div id="threejs-container"></div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <p>© 2025 Agentic AI All Rights Reserved</p>
  </footer>

  <!-- Circular Button Section with Colorful Titles -->
  <div class="circular-btns">
    <div class="circular-btn-container">
      <div class="circular-btn" onclick="openSymbolModal()">
        <i class="fas fa-download"></i>
      </div>
      <span class="btn-label" style="color:#f44336;">Fetch Data</span>
    </div>
    <div class="circular-btn-container">
      <div class="circular-btn" onclick="technicalAnalysis()">
        <i class="fas fa-chart-line"></i>
      </div>
      <span class="btn-label" style="color:#3f51b5;">Technical Analysis</span>
    </div>
    <div class="circular-btn-container">
      <div class="circular-btn" onclick="predict()">
        <i class="fas fa-rocket"></i>
      </div>
      <span class="btn-label" style="color:#4caf50;">Predict</span>
    </div>
    <div class="circular-btn-container">
      <div class="circular-btn" onclick="openBacktestModal()">
        <i class="fas fa-history"></i>
      </div>
      <span class="btn-label" style="color:#ff9800;">Backtest</span>
    </div>
    <div class="circular-btn-container">
      <div class="circular-btn" onclick="riskAnalysis()">
        <i class="fas fa-exclamation-triangle"></i>
      </div>
      <span class="btn-label" style="color:#9c27b0;">Risk Analysis</span>
    </div>
    <div class="circular-btn-container">
      <div class="circular-btn" onclick="generateReport()">
        <i class="fas fa-file-alt"></i>
      </div>
      <span class="btn-label" style="color:#00bcd4;">Generate Report</span>
    </div>
  </div>

  <!-- Modal for Entering Symbol & Selecting Data Source -->
  <div class="modal fade" id="symbolModal" tabindex="-1" aria-labelledby="symbolModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content bg-light text-dark">
        <div class="modal-header">
          <h5 class="modal-title" id="symbolModalLabel">Enter Symbol to Fetch Data</h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label for="modalSymbolInput">Symbol (e.g., BTCUSDT or BTC-USD):</label>
            <input type="text" id="modalSymbolInput" class="form-control" placeholder="Enter symbol" />
          </div>
          <div class="form-group">
            <label for="dataSourceSelect">Data Source:</label>
            <select id="dataSourceSelect" class="form-control">
              <option value="binance">Binance</option>
              <option value="yfinance">Yahoo Finance</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-primary" onclick="fetchData()">Submit</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal for Backtest Strategy Selection -->
  <div class="modal fade" id="backtestStrategyModal" tabindex="-1" aria-labelledby="backtestStrategyModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content bg-light text-dark">
        <div class="modal-header">
          <h5 class="modal-title" id="backtestStrategyModalLabel">Select Backtesting Strategy</h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label for="backtestStrategySelect">Choose a Strategy:</label>
            <select id="backtestStrategySelect" class="form-control">
              <!-- Options will be populated via AJAX -->
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-primary" onclick="runBacktestStrategy()">Run Backtest</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal for Results/Plots -->
  <div class="modal fade" id="resultsModal" tabindex="-1" aria-labelledby="resultsModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content bg-light text-dark">
        <div class="modal-header">
          <h5 class="modal-title" id="resultsModalLabel">Results</h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body" id="resultsModalBody">
          <pre id="resultsJson" class="bg-white p-3 border" style="max-height: 300px;"></pre>
          <img id="resultsPlot" class="plot-img d-none" alt="Plot" />
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.bundle.min.js"></script>

  <!-- Three.js 3D $ Text Script -->
  <script>
    // Initialize Three.js scene in the #threejs-container
    const container = document.getElementById("threejs-container");
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.z = 100;

    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    container.appendChild(renderer.domElement);

    // Add lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);
    const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
    directionalLight.position.set(1, 1, 1);
    scene.add(directionalLight);

    // Load font and create 3D text geometry
    const loader = new THREE.FontLoader();
    loader.load('https://threejs.org/examples/fonts/helvetiker_regular.typeface.json', function(font) {
      const textGeometry = new THREE.TextGeometry("$", {
        font: font,
        size: 30,
        height: 5,
        curveSegments: 12,
        bevelEnabled: true,
        bevelThickness: 1,
        bevelSize: 1,
        bevelSegments: 5
      });
      textGeometry.center();
      const textMaterial = new THREE.MeshPhongMaterial({ color: 0x4caf50 });
      const textMesh = new THREE.Mesh(textGeometry, textMaterial);
      scene.add(textMesh);

      // Animate the 3D text
      function animate() {
        requestAnimationFrame(animate);
        textMesh.rotation.y += 0.01;
        renderer.render(scene, camera);
      }
      animate();
    });
  </script>

  <!-- Existing JavaScript functions (fetchData, technicalAnalysis, etc.) -->
  <script>
    let cachedSymbol = "";

    // Global loader functions
    function showGlobalLoader() {
      $("#loader-overlay").css("display", "flex").fadeIn(100);
    }
    function hideGlobalLoader() {
      $("#loader-overlay").fadeOut(100);
    }

    // On document ready, fetch available strategies and populate the dropdown.
    $(document).ready(function() {
      $.get('/strategies', function(data) {
        let select = $('#backtestStrategySelect');
        select.empty();
        select.append('<option value="">Default (use built-in strategy)</option>');
        if (data.strategies && data.strategies.length > 0) {
          data.strategies.forEach(function(strategy) {
            select.append('<option value="' + strategy + '">' + strategy + '</option>');
          });
        }
      }).fail(function() {
        console.error("Failed to fetch strategies.");
      });
    });

    function openSymbolModal() {
      $("#modalSymbolInput").val("");
      $("#symbolModal").modal("show");
    }

    function fetchData() {
      const symbol = $("#modalSymbolInput").val();
      const dataSource = $("#dataSourceSelect").val();
      if (!symbol) {
        alert("Please enter a symbol.");
        return;
      }
      cachedSymbol = symbol;
      $("#symbolModal").modal("hide");
      showGlobalLoader();
      setTimeout(function() {
        $.get(`/fetch_data?symbol=${symbol}&source=${dataSource}`, function(data) {
          hideGlobalLoader();
          console.log("Fetch Data Response:", data);
          $("#resultsModal").modal("show");
          if (data.error) {
            $("#resultsJson").text(JSON.stringify({ error: data.error }, null, 2));
            $("#resultsPlot").addClass("d-none");
            return;
          }
          $("#resultsJson").text(JSON.stringify(data, null, 2));
          if (data.fetch_url) {
            let src = data.fetch_url;
            if (!src.startsWith("data:image/png;base64,")) {
              src = "data:image/png;base64," + src;
            }
            $("#resultsPlot").attr("src", src).removeClass("d-none");
          } else {
            $("#resultsPlot").addClass("d-none");
          }
        }).fail(function(jqXHR, textStatus, errorThrown) {
          hideGlobalLoader();
          $("#resultsModal").modal("show");
          $("#resultsJson").text(JSON.stringify({ error: errorThrown }, null, 2));
          $("#resultsPlot").addClass("d-none");
        });
      }, 100);
    }

    function technicalAnalysis() {
      if (!cachedSymbol) {
        alert("Please fetch data first.");
        return;
      }
      showGlobalLoader();
      setTimeout(function() {
        $.get(`/technical_analysis?symbol=${cachedSymbol}`, function(data) {
          hideGlobalLoader();
          console.log("Technical Analysis Response:", data);
          $("#resultsModal").modal("show");
          if (data.error) {
            $("#resultsJson").text(JSON.stringify({ error: data.error }, null, 2));
            $("#resultsPlot").addClass("d-none");
            return;
          }
          $("#resultsJson").text(JSON.stringify(data, null, 2));
          $("#resultsPlot").addClass("d-none");
        }).fail(function(jqXHR, textStatus, errorThrown) {
          hideGlobalLoader();
          $("#resultsModal").modal("show");
          $("#resultsJson").text(JSON.stringify({ error: errorThrown }, null, 2));
          $("#resultsPlot").addClass("d-none");
        });
      }, 100);
    }

    function predict() {
      if (!cachedSymbol) {
        alert("Please fetch data first.");
        return;
      }
      showGlobalLoader();
      setTimeout(function() {
        $.get(`/predict?symbol=${cachedSymbol}`, function(data) {
          hideGlobalLoader();
          console.log("Predict Response:", data);
          $("#resultsModal").modal("show");
          if (data.error) {
            $("#resultsJson").text(JSON.stringify({ error: data.error }, null, 2));
            $("#resultsPlot").addClass("d-none");
            return;
          }
          $("#resultsJson").text(JSON.stringify(data, null, 2));
          if (data.predict_url && data.predict_url.trim().length > 0) {
            let src = data.predict_url;
            if (!src.startsWith("data:image/png;base64,")) {
              src = "data:image/png;base64," + src;
            }
            console.log("Final predict URL:", src);
            $("#resultsPlot").attr("src", src).removeClass("d-none");
          } else {
            console.log("No predict_url returned or empty.");
            $("#resultsPlot").addClass("d-none");
          }
        }).fail(function(jqXHR, textStatus, errorThrown) {
          hideGlobalLoader();
          $("#resultsModal").modal("show");
          $("#resultsJson").text(JSON.stringify({ error: errorThrown }, null, 2));
          $("#resultsPlot").addClass("d-none");
        });
      }, 100);
    }

    function openBacktestModal() {
      if (!cachedSymbol) {
        alert("Please fetch data first.");
        return;
      }
      $("#backtestStrategyModal").modal("show");
    }

    function runBacktestStrategy() {
      const strategy = $("#backtestStrategySelect").val();
      $("#backtestStrategyModal").modal("hide");
      showGlobalLoader();
      setTimeout(function() {
        $.get(`/backtest?symbol=${cachedSymbol}&strategy=${strategy}`, function(data) {
          hideGlobalLoader();
          console.log("Backtest Response:", data);
          $("#resultsModal").modal("show");
          if (data.error && typeof data.error === 'string' && data.error.trim().length > 0) {
            $("#resultsJson").text(JSON.stringify({ error: data.error }, null, 2));
            $("#resultsPlot").addClass("d-none");
            return;
          }
          $("#resultsJson").text(JSON.stringify(data.backtest_results, null, 2));
          if (data.plot_url && data.plot_url.trim().length > 0) {
            let src = data.plot_url;
            if (!src.startsWith("data:image/png;base64,")) {
              src = "data:image/png;base64," + src;
            }
            $("#resultsPlot").attr("src", src).removeClass("d-none");
          } else {
            $("#resultsPlot").addClass("d-none");
          }
        }).fail(function(jqXHR, textStatus, errorThrown) {
          hideGlobalLoader();
          $("#resultsModal").modal("show");
          $("#resultsJson").text(JSON.stringify({ error: errorThrown }, null, 2));
          $("#resultsPlot").addClass("d-none");
        });
      }, 100);
    }

    function riskAnalysis() {
      if (!cachedSymbol) {
        alert("Please fetch data first.");
        return;
      }
      showGlobalLoader();
      setTimeout(function() {
        $.get(`/risk_analysis?symbol=${cachedSymbol}`, function(data) {
          hideGlobalLoader();
          console.log("Risk Analysis Response:", data);
          $("#resultsModal").modal("show");
          if (data.error) {
            $("#resultsJson").text(JSON.stringify({ error: data.error }, null, 2));
            $("#resultsPlot").addClass("d-none");
            return;
          }
          $("#resultsJson").text(JSON.stringify(data, null, 2));
          $("#resultsPlot").addClass("d-none");
        }).fail(function(jqXHR, textStatus, errorThrown) {
          hideGlobalLoader();
          $("#resultsModal").modal("show");
          $("#resultsJson").text(JSON.stringify({ error: errorThrown }, null, 2));
          $("#resultsPlot").addClass("d-none");
        });
      }, 100);
    }

    function generateReport() {
      if (!cachedSymbol) {
        alert("Please fetch data first.");
        return;
      }
      showGlobalLoader();
      setTimeout(function() {
        $.get(`/generate_report?symbol=${cachedSymbol}`, function(data) {
          hideGlobalLoader();
          console.log("Generate Report Response:", data);
          $("#resultsModal").modal("show");
          if (data.error) {
            $("#resultsJson").text(JSON.stringify({ error: data.error }, null, 2));
            $("#resultsPlot").addClass("d-none");
            return;
          }
          if (data.report_file) {
            let iframeHtml = `<iframe src="${data.report_file}" width="100%" height="500px"></iframe>`;
            $("#resultsJson").html(iframeHtml);
            $("#resultsPlot").addClass("d-none");
          } else {
            $("#resultsJson").text(JSON.stringify(data, null, 2));
            $("#resultsPlot").addClass("d-none");
          }
        }).fail(function(jqXHR, textStatus, errorThrown) {
          hideGlobalLoader();
          $("#resultsModal").modal("show");
          $("#resultsJson").text(JSON.stringify({ error: errorThrown }, null, 2));
          $("#resultsPlot").addClass("d-none");
        });
      }, 100);
    }
  </script>
</body>
</html>
